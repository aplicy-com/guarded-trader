name: Bug report
description: Something doesn't work as documented (not security or trading-safety; use the private link for those).
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste secrets**: keys, tokens, `.env` contents, IP addresses, chat or account IDs. Redact logs first.
        If this could let the system place an order, hold a withdraw-capable key, or skip a halt, close this form and report it privately (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Trading mode
      options: [dry_run, live, not running (tests/docs/research)]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Commit hash, OS, Docker version, Freqtrade image tag, which service (Conductor / Freqtrade / research harness).
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted logs or output
      render: text
