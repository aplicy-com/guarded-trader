
name: Documentation links

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Check relative links and heading anchors on every PR.
      # Offline mode prevents external websites from blocking PRs.
      - name: Check local links and anchors
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >
            --offline
            --no-progress
            --root-dir .
            --include-fragments=anchor-only
            './**/*.md'
          fail: true

      # External URLs are checked only weekly or manually.
      - name: Check external links
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >
            --no-progress
            --root-dir .
            --include-fragments=anchor-only
            --exclude 'https://ai-trader-vps\.<tailnet>\.ts\.net/?'
            './**/*.md'
          fail: true
