<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d">
  <title id="t">Guarded Trader</title>
  <desc id="d">The LLM researches. It never trades. Negative results published.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e2a44" stroke-width="1"/>
    </pattern>
    <clipPath id="chart"><rect x="760" y="120" width="440" height="400"/></clipPath>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect x="760" y="120" width="440" height="400" fill="url(#grid)" opacity="0.9"/>

  <!-- A strategy's equity curve falls; the guard line holds; trading halts at the limit. -->
  <g clip-path="url(#chart)">
    <path d="M760 250 L800 236 L840 262 L880 228 L920 270 L960 300 L1000 288 L1040 336 L1060 352"
          fill="none" stroke="#f87171" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    <line x1="760" y1="352" x2="1200" y2="352" stroke="#2dd4bf" stroke-width="2" stroke-dasharray="10 8" opacity="0.8"/>
  </g>
  <circle cx="1060" cy="352" r="9" fill="#0b1220" stroke="#2dd4bf" stroke-width="4"/>
  <text x="1196" y="394" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#2dd4bf">HALT · human clears</text>
  <text x="772" y="378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="16" fill="#5eead4" opacity="0.75">hard loss limit</text>

  <!-- Shield mark -->
  <g transform="translate(96 112)">
    <path d="M36 0 L72 12 V40 C72 62 56 78 36 86 C16 78 0 62 0 40 V12 Z" fill="url(#shield)"/>
    <path d="M18 46 L31 58 L55 30" fill="none" stroke="#0b1220" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <text x="96" y="296" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="88" font-weight="800" fill="#f8fafc" letter-spacing="-2">Guarded Trader</text>
  <text x="98" y="358" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="34" font-weight="500" fill="#cbd5e1">The LLM researches. It never trades.</text>

  <g transform="translate(98 404)">
    <rect width="420" height="56" rx="28" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
    <circle cx="32" cy="28" r="7" fill="#fbbf24"/>
    <text x="54" y="37" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="25" font-weight="700" fill="#fbbf24">Negative results published</text>
  </g>

  <text x="98" y="560" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#64748b">Freqtrade · walk-forward · random-entry null · hard halts · Apache-2.0</text>
  <text x="1200" y="84" text-anchor="end" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="20" fill="#94a3b8">aplicy-com/guarded-trader</text>
</svg>
