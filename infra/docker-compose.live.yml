# LIVE PILOT override (ADR-0019). Never used directly: scripts/trading-mode.sh selects it
# (docker compose -f docker-compose.yml -f docker-compose.live.yml) after its gates pass.
#
# What it changes relative to the dry-run stack:
#   freqtrade  config.live.json (dry_run=false, boots paused, ONE position), its own trade DB,
#              and the Kraken key (the only container that ever receives it).
#   conductor  TRADING_MODE=live, a FRESH ledger in its own volume (the dry-run ledger is never
#              carried over), PRINCIPAL_USD=20, DAILY_PROFIT_CAP_USD=2, one position (R7).
# Values that define the pilot are literals on purpose: they are reviewed in git, and a stray
# .env value cannot quietly change the principal or the position cap.
services:
  freqtrade:
    command: >
      trade
      --config /freqtrade/user_data/config.live.json
      --strategy Baseline4h
      --logfile /freqtrade/user_data/logs/freqtrade.live.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.live.sqlite
    environment:
      FREQTRADE__EXCHANGE__KEY: ${KRAKEN_API_KEY:?set KRAKEN_API_KEY in .env (see go-live-pilot.md)}
      FREQTRADE__EXCHANGE__SECRET: ${KRAKEN_API_SECRET:?set KRAKEN_API_SECRET in .env}

  conductor:
    environment:
      TRADING_MODE: live
      PRINCIPAL_USD: "20"
      DAILY_PROFIT_CAP_USD: "2"
      MAX_CONCURRENT_POSITIONS: "1"
      BACKUP_FREQTRADE_DB_PATH: /freqtrade-user-data/tradesv3.live.sqlite
    volumes:
      - conductor-data-live:/data

volumes:
  conductor-data-live:
