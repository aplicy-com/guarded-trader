# Freqtrade (Phase 2) + Conductor skeleton (Phase 3, work package 3A-1).
# See ../docs/04-architecture/overview.md.
#
# Run with the repo-root .env supplied for interpolation (the Makefile does
# this): docker compose --env-file .env -f infra/docker-compose.yml ...
#
# Image tag is pinned to a specific release, not `stable`/`latest`, per
# ../docs/04-architecture/security.md ("Docker base images pinned to
# specific tags/digests, not latest"). `stable` pointed at 2026.8 at the
# time this file was written; bump the tag deliberately, never track it.
services:
  freqtrade:
    image: freqtradeorg/freqtrade:2026.8
    container_name: ai-trading-agent-freqtrade
    restart: unless-stopped
    command: >
      trade
      --config /freqtrade/user_data/config.dry_run.json
      --strategy Baseline4h
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.dryrun.sqlite
    volumes:
      - ../services/freqtrade/user_data:/freqtrade/user_data
    # REST API bound to loopback only — no other ports are published.
    # See ../docs/04-architecture/security.md ("No inbound public ports").
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - ../.env
    # Telegram is Conductor's now (3A-4, ADR-0015). env_file hands Freqtrade the whole .env,
    # and Freqtrade lets FREQTRADE__* variables override its config file, so a leftover
    # FREQTRADE__TELEGRAM__ENABLED=true in .env would silently re-enable its bot. Pin it off
    # and blank every Telegram variable: the bot token reaches the conductor container only.
    environment:
      FREQTRADE__TELEGRAM__ENABLED: "false"
      TELEGRAM_BOT_TOKEN: ""
      TELEGRAM_ALLOWED_CHAT_IDS: ""
      FREQTRADE__TELEGRAM__TOKEN: ""
      FREQTRADE__TELEGRAM__CHAT_ID: ""
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Conductor: internal only. NO ports are published; it is reachable solely
  # by other containers on this compose network (Freqtrade's API is reached at
  # http://freqtrade:8080). It deliberately does NOT use env_file: ../.env, so
  # the Kraken keys and Freqtrade's Telegram token never enter this container;
  # it receives only the variables listed below.
  conductor:
    build:
      context: ../services/conductor
    image: ai-trading-agent-conductor:0.1.0
    container_name: ai-trading-agent-conductor
    restart: unless-stopped
    depends_on:
      freqtrade:
        condition: service_healthy
    environment:
      TRADING_MODE: ${TRADING_MODE:-dry_run}
      PRINCIPAL_USD: ${PRINCIPAL_USD:?set PRINCIPAL_USD in .env}
      DATABASE_URL: sqlite:////data/conductor.db
      FREQTRADE_API_URL: http://freqtrade:8080
      # R3. The daily cap's value is TBD (Phase 3): blank = unset = nothing is fenced.
      DAILY_PROFIT_CAP_USD: ${DAILY_PROFIT_CAP_USD:-}
      MANUAL_MOVE_THRESHOLD_USD: ${MANUAL_MOVE_THRESHOLD_USD:-25}
      # R4 second layer + R7 (drafts, docs/02-requirements.md). Keep
      # MAX_CONCURRENT_POSITIONS equal to max_open_trades in the Freqtrade config.
      DAILY_LOSS_LIMIT_PCT: ${DAILY_LOSS_LIMIT_PCT:-3}
      MAX_DRAWDOWN_PCT: ${MAX_DRAWDOWN_PCT:-10}
      CONSECUTIVE_LOSS_LIMIT: ${CONSECUTIVE_LOSS_LIMIT:-3}
      MAX_CONCURRENT_POSITIONS: ${MAX_CONCURRENT_POSITIONS:-2}
      RISK_CHECK_INTERVAL_SECONDS: ${RISK_CHECK_INTERVAL_SECONDS:-60}
      # Telegram (3A-4): the only container that receives the token. Blank = Telegram off.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_ALLOWED_CHAT_IDS: ${TELEGRAM_ALLOWED_CHAT_IDS:-}
      TELEGRAM_COMMANDS_ENABLED: ${TELEGRAM_COMMANDS_ENABLED:-true}
      FREQTRADE__API_SERVER__USERNAME: ${FREQTRADE__API_SERVER__USERNAME:?set in .env}
      FREQTRADE__API_SERVER__PASSWORD: ${FREQTRADE__API_SERVER__PASSWORD:?set in .env}
    volumes:
      - conductor-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  conductor-data:
